
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pink Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Khushi-Verse
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=FF69B4&color_dots=FCE4EC,F8BBD0,EF93C4,EC80B5,C44587

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
